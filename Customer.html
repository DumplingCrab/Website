<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Activation Tracker</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, select, button { margin: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <h2>Customer Activation Tracker</h2>

  <!-- Username Sign-In -->
  <label>Username: <input type="text" id="username" /></label>
  <button onclick="signIn()">Sign In</button>
  <p id="userStatus"></p>

  <!-- Add New Customer -->
  <h3>Add New Customer</h3>
  <label>Customer Name: <input type="text" id="newCustomerName" /></label>
  <label>Status:
    <select id="newStatus">
      <option value="shipping">Shipping</option>
      <option value="delivered">Delivered</option>
      <option value="activated">Activated</option>
      <option value="setup">Setup</option>
    </select>
  </label>
  <button onclick="addCustomer()">Add Customer</button>

  <!-- Customer Table -->
  <h3>Customer List</h3>
  <table id="customerTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Last Call</th>
        <th>Time Since Call</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
let currentUser = "";

function signIn() {
  const usernameInput = document.getElementById("username").value.trim();
  if (usernameInput === "") return alert("Enter a username.");
  currentUser = usernameInput;
  document.getElementById("userStatus").innerText = `Signed in as: ${currentUser}`;
  loadCustomers();
}

function loadCustomers() {
  const data = JSON.parse(localStorage.getItem("customers") || "[]");
  const tbody = document.querySelector("#customerTable tbody");
  tbody.innerHTML = "";

  data.filter(c => c.username === currentUser).forEach((c, index) => {
    const lastCallDate = new Date(c.lastCall);
    const now = new Date();
    const diffMinutes = Math.floor((now - lastCallDate) / 60000);
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${c.name}</td>
      <td>
        <select onchange="updateStatus(${index}, this.value)">
          ${["shipping", "delivered", "activated", "setup"].map(opt =>
            `<option value="${opt}" ${opt === c.status ? "selected" : ""}>${opt}</option>`).join("")}
        </select>
      </td>
      <td>${c.lastCall}</td>
      <td>${diffMinutes} min ago</td>
      <td><button onclick="markCalled(${index})">Mark Called</button></td>
    `;
    tbody.appendChild(row);
  });
}

function addCustomer() {
  if (currentUser === "") return alert("Sign in first.");
  const name = document.getElementById("newCustomerName").value.trim();
  const status = document.getElementById("newStatus").value;
  if (name === "") return alert("Customer name required.");

  const data = JSON.parse(localStorage.getItem("customers") || "[]");
  data.push({
    username: currentUser,
    name,
    status,
    lastCall: new Date().toISOString()
  });
  localStorage.setItem("customers", JSON.stringify(data));
  document.getElementById("newCustomerName").value = "";
  loadCustomers();
}

function markCalled(index) {
  const data = JSON.parse(localStorage.getItem("customers") || "[]");
  const filtered = data.filter(c => c.username === currentUser);
  const globalIndex = data.findIndex(c => c.username === currentUser && c.name === filtered[index].name);
  data[globalIndex].lastCall = new Date().toISOString();
  localStorage.setItem("customers", JSON.stringify(data));
  loadCustomers();
}

function updateStatus(index, newStatus) {
  const data = JSON.parse(localStorage.getItem("customers") || "[]");
  const filtered = data.filter(c => c.username === currentUser);
  const globalIndex = data.findIndex(c => c.username === currentUser && c.name === filtered[index].name);
  data[globalIndex].status = newStatus;
  localStorage.setItem("customers", JSON.stringify(data));
  loadCustomers();
}
</script>
</body>
</html>
